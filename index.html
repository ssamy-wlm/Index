<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WebLight Media — Company Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#f8f9fa; --bg2:#ffffff; --bg3:#f0f2f5; --border:#e2e8f0; --text:#1a202c; --text2:#4a5568; --text3:#718096;
 --accent:#f5b301; --accent2:#d89e00; --accentbg:#fdf1d6; --on-accent:#152444; --live:#2ecc71;
  --soon:#f59e0b; --soonbg:#fef3c7; --red:#e53e3e; --redbg:#fff5f5;
  --blue:#1A73E8; --bluebg:#e8f0fe;
  --navy:#152444; --navy2:#1c3157; --sidebar-hairline:#26375c; --nav-text:#c7d0e6; --section-muted:#7c8bb0;
  --sidebar:240px; --header:60px;
  --sh1:0 1px 3px rgba(0,0,0,.08); --sh2:0 4px 12px rgba(0,0,0,.1); --sh3:0 8px 24px rgba(0,0,0,.12);
  --radius:12px; --radius2:6px;
}
[data-theme="dark"] {
  --bg:#0f1117; --bg2:#1a1d27; --bg3:#242736; --border:#2d3148; --text:#e2e8f0; --text2:#a0aec0; --text3:#718096;
  --accentbg:#332a10; --soonbg:#2e2a1a; --redbg:#2e1a1a; --bluebg:#1a2340;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* LOGIN */
.login-overlay{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:40px 36px;width:100%;max-width:380px;text-align:center;box-shadow:var(--sh3)}
.login-logo{width:56px;height:56px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.login-logo svg{width:100%;height:100%;display:block}
.login-card h1{font-size:20px;font-weight:700;margin-bottom:4px}
.login-card p{color:var(--text3);font-size:13px;margin-bottom:24px}
.login-input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg3);color:var(--text);font-size:16px;text-align:center;letter-spacing:4px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.login-input:focus{border-color:var(--accent)}
.login-btn{width:100%;margin-top:12px;padding:12px;background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.login-btn:hover{background:var(--accent2)}
.login-error{color:var(--red);font-size:12px;margin-top:8px;min-height:18px}
/* ADMIN AUTH MODAL */
.admin-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:8000}
.admin-modal-overlay.open{display:flex}
.admin-modal-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:340px;text-align:center;box-shadow:var(--sh3)}
.admin-modal-card h2{font-size:18px;font-weight:700;margin-bottom:6px}
.admin-modal-card p{color:var(--text3);font-size:13px;margin-bottom:20px}
.admin-modal-input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg3);color:var(--text);font-size:15px;text-align:center;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.admin-modal-input:focus{border-color:var(--accent)}
.admin-modal-btns{display:flex;gap:8px;margin-top:12px}
.admin-modal-btns button{flex:1;padding:10px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;border:none}
.btn-confirm{background:var(--accent);color:var(--on-accent)}
.btn-confirm:hover{background:var(--accent2)}
.btn-cancel-modal{background:var(--bg3);color:var(--text2);border:1px solid var(--border)!important}
.admin-modal-error{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}

/* LAYOUT */
.wiki-layout{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--navy);border-right:1px solid var(--sidebar-hairline);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0}
.sidebar-header{padding:16px;border-bottom:1px solid var(--sidebar-hairline)}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-logo svg{width:100%;height:100%;display:block}
.brand-text{overflow:hidden}
.brand-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.brand-sub{font-size:11px;color:var(--section-muted)}
.sidebar-nav{padding:8px 0;flex:1}
.nav-section{padding:8px 12px 4px;font-size:11px;font-weight:600;color:var(--section-muted);letter-spacing:.8px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:1px 8px;border-radius:var(--radius2);cursor:pointer;color:var(--nav-text);font-size:13px;font-weight:500;transition:all .15s;text-decoration:none}
.nav-item:hover{background:var(--navy2);color:#fff}
.nav-item.active{background:var(--accent);color:var(--on-accent);font-weight:600}
.nav-item .nav-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-item .nav-icon svg{display:block}
.sidebar-footer{padding:12px;border-top:1px solid var(--sidebar-hairline)}
.theme-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:var(--radius2);background:var(--navy2);border:1px solid var(--sidebar-hairline);color:var(--nav-text);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif}
.theme-btn:hover{background:var(--sidebar-hairline)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.main-header{height:var(--header);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100}
.main-header-left{display:flex;align-items:center;gap:12px}
.header-title{font-size:16px;font-weight:700}
.header-actions{display:flex;align-items:center;gap:8px}
.admin-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--radius2);background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500}
.admin-btn:hover{border-color:var(--accent);color:var(--accent)}
.admin-btn.active-admin{background:var(--accentbg);color:var(--accent);border-color:var(--accent)}
.search-wrap{position:relative}
.search-input{padding:7px 12px 7px 32px;border:1px solid var(--border);border-radius:var(--radius2);background:var(--bg3);color:var(--text);font-size:13px;width:200px;outline:none;font-family:'Inter',sans-serif}
.search-input:focus{border-color:var(--accent);width:240px;transition:width .2s}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);display:flex}
.search-icon svg{display:block}

/* CONTENT */
.main-body{padding:20px;flex:1}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat-val{font-size:22px;font-weight:700;color:var(--accent)}
.stat-label{font-size:12px;color:var(--text3);margin-top:2px}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.pill .pill-icon{width:13px;height:13px;display:flex;flex-shrink:0}
.pill .pill-icon svg{display:block}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* SECTION */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;margin-top:8px}
.section-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-title .section-icon{width:16px;height:16px;display:flex;flex-shrink:0}
.section-title .section-icon svg{display:block}
.section-count{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:2px 8px;font-size:11px;color:var(--text3);font-weight:600}

/* CARDS GRID */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:24px}
.sop-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .2s;position:relative}
.sop-card:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--accent)}
.sop-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.icon-chip{display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accentbg);color:var(--accent)}
.icon-chip svg{display:block}
.sop-icon.icon-chip{width:34px;height:34px;border-radius:8px}
.sop-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.badge{padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.badge-soon{background:var(--soonbg);color:var(--soon)}
.sop-title{font-size:14px;font-weight:500;margin-bottom:4px;line-height:1.3}
.sop-desc{font-size:12px;color:var(--text3);margin-bottom:10px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sop-meta{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);font-size:10px;color:var(--text3)}
.tag svg{width:11px;height:11px;display:block}
.admin-card-btns{position:absolute;top:10px;right:10px;display:none;gap:4px}
.admin-mode .admin-card-btns{display:flex}
.admin-mode .sop-card:hover .admin-card-btns{display:flex}
.edit-btn,.del-btn{width:26px;height:26px;border-radius:6px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.edit-btn svg,.del-btn svg{width:14px;height:14px;display:block}
.edit-btn{background:var(--bluebg);color:var(--blue)}
.del-btn{background:var(--redbg);color:var(--red)}

/* SM WIKI CARD */
.sm-wiki-card{background:linear-gradient(135deg,var(--navy),var(--navy2));border:1px solid var(--sidebar-hairline);border-radius:var(--radius);padding:18px;cursor:pointer;transition:all .2s;margin-bottom:14px;color:var(--nav-text)}
.sm-wiki-card:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.gbp-card-featured{background:linear-gradient(135deg,var(--navy),var(--navy2));border:2px solid var(--accent);border-radius:var(--radius);padding:18px;cursor:pointer;transition:all .2s;margin-bottom:14px;color:var(--nav-text)}
.gbp-card-featured:hover{transform:translateY(-2px);box-shadow:var(--sh2)}

/* CLIENT TILES */
.client-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:24px}
.client-tile{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .2s}
.client-tile:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--accent)}
.client-tile-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.client-icon.icon-chip{width:26px;height:26px;border-radius:6px}
.client-title{font-weight:500;font-size:13px}
.client-platforms{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.client-freq{font-size:11px;color:var(--text3)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:5000;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:14px;width:100%;max-width:680px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--sh3)}
.modal-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.modal-icon.icon-chip{width:42px;height:42px;border-radius:10px}
.modal-header-text{flex:1;min-width:0}
.modal-title{font-size:17px;font-weight:700}
.modal-sub{font-size:12px;color:var(--text3);margin-top:2px}
.modal-close{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0}
.modal-close svg{width:15px;height:15px;display:block}
.modal-close:hover{background:var(--bg);color:var(--red)}
.fullscreen-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--radius2);font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;letter-spacing:.2px;box-shadow:0 2px 6px rgba(245,179,1,.3)}
.fullscreen-btn:hover{background:var(--accent2);box-shadow:0 3px 10px rgba(245,179,1,.4)}
.fullscreen-btn.disabled{background:var(--bg3);color:var(--text3);border:1px solid var(--border);box-shadow:none;cursor:not-allowed}
.preview-fullscreen-bar{display:flex;justify-content:flex-end;margin-bottom:12px}
.fs-overlay{position:fixed;inset:0;background:var(--bg);z-index:9000;display:none;flex-direction:column}
.fs-overlay.open{display:flex}
.fs-bar{height:48px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.fs-title{font-size:14px;font-weight:700;color:var(--text)}
.fs-close{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--redbg);color:var(--red);border:1px solid var(--red);border-radius:var(--radius2);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.fs-close svg{width:14px;height:14px;display:block}
.fs-close:hover{background:var(--red);color:#fff}
.fs-frame{flex:1;width:100%;border:none}
.modal-tabs{display:flex;padding:0 20px;border-bottom:1px solid var(--border);gap:0}
.modal-tab{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--text3);transition:all .15s}
.modal-tab svg{width:14px;height:14px;display:block}
.modal-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-section{margin-bottom:16px}
.modal-section-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.modal-tags{display:flex;flex-wrap:wrap;gap:6px}
.modal-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);font-size:12px;color:var(--text2)}
.modal-tag svg{width:12px;height:12px;display:block}
.sections-list{display:flex;flex-direction:column;gap:4px}
.section-item{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg3);border-radius:var(--radius2);font-size:12px}
.section-num{width:20px;height:20px;border-radius:50%;background:var(--accentbg);color:var(--accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.preview-frame{width:100%;height:500px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg3)}
.preview-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--text3);font-size:13px;gap:8px}

/* ADMIN PANEL */
.admin-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:20px}
.admin-panel-title{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.admin-panel-title svg,.admin-section-title svg{width:14px;height:14px;display:block}
.admin-section{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.admin-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.admin-section-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.form-row.single{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:11px;font-weight:600;color:var(--text3)}
.form-input,.form-select,.form-textarea{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius2);background:var(--bg3);color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-textarea{resize:vertical;min-height:70px}
.btn-primary{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--radius2);font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.btn-primary svg{width:14px;height:14px;display:block}
.btn-primary:hover{background:var(--accent2)}
.btn-secondary{padding:7px 12px;background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:var(--radius2);font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{padding:7px 12px;background:var(--redbg);color:var(--red);border:1px solid var(--red);border-radius:var(--radius2);font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif}
.btn-danger:hover{background:var(--red);color:#fff}
.sop-edit-list{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto}
.sop-edit-item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:10px 12px;display:flex;align-items:center;gap:8px}
.sop-edit-name{flex:1;font-size:13px;font-weight:500}
.sop-edit-form{display:none;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:12px;margin-top:6px}
.sop-edit-form.open{display:block}
.pass-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px}
.pass-row .form-group{flex:1}
.pass-row button{white-space:nowrap;margin-bottom:0}
.success-msg{color:var(--live);font-size:12px;font-weight:600}

/* NO RESULTS */
.no-results{text-align:center;padding:60px 20px;color:var(--text3)}
.no-results-icon{display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.no-results-icon svg{width:40px;height:40px;display:block}

/* MOBILE */
@media(max-width:768px){
  .sidebar{display:none}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .search-input{width:160px}
  .form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-overlay" id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 30 34" fill="none" aria-label="WebLight Media" role="img">
        <path d="M15 2 C8.4 2 3.5 6.9 3.5 13 c0 3.6 1.8 6.4 4.2 8.3 v2.2 h14.6 v-2.2 c2.4 -1.9 4.2 -4.7 4.2 -8.3 C26.5 6.9 21.6 2 15 2 Z" stroke="#f5b301" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M9 27 h12 M10 30 h10 M12 33 h6" stroke="#f5b301" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>WebLight Media</h1>
    <p>Company Wiki — Internal Access Only</p>
    <input type="password" class="login-input" id="login-pin" placeholder="Enter passcode" maxlength="20"
      onkeydown="if(event.key==='Enter')checkLogin()"/>
    <button class="login-btn" onclick="checkLogin()">Access Wiki</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ADMIN AUTH MODAL -->
<div class="admin-modal-overlay" id="admin-auth-modal">
  <div class="admin-modal-card">
    <div id="admin-modal-icon" style="display:flex;justify-content:center;color:var(--accent);margin-bottom:12px"></div>
    <h2>Admin Access</h2>
    <p>Enter the admin passcode to manage SOPs</p>

// ─── AUTH ─────────────────────────────────────────────────────
function checkLogin(){
  const pin = document.getElementById('login-pin').value.trim();
  if(pin===DEFAULT_APP_PASS || pin===getCurrentAppPass()){
    sessionStorage.setItem('wl_authenticated','1');
    const s=document.getElementById('login-screen');
    s.style.opacity='0';s.style.pointerEvents='none';
    setTimeout(()=>{s.style.display='none';document.getElementById('app').style.display='flex';render();},400);
  } else {
    document.getElementById('login-error').textContent='Incorrect passcode. Please try again.';
    document.getElementById('login-pin').value='';
  }
}
if(sessionStorage.getItem('wl_authenticated')==='1'){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
}

// ─── ADMIN MODAL ──────────────────────────────────────────────
let adminMode=false;
function openAdminModal(){
  if(adminMode){adminMode=false;document.getElementById('admin-btn').classList.remove('active-admin');document.getElementById('admin-btn').innerHTML=adminBtnHtml(false);render();return;}
  document.getElementById('admin-auth-modal').classList.add('open');
  setTimeout(()=>document.getElementById('admin-pin').focus(),100);
}
function closeAdminModal(){
  document.getElementById('admin-auth-modal').classList.remove('open');
  document.getElementById('admin-pin').value='';
  document.getElementById('admin-error').textContent='';
}
function checkAdminCode(){
  const code=document.getElementById('admin-pin').value.trim();
  if(code===DEFAULT_ADMIN_PASS || code===getCurrentAdminPass()){
    adminMode=true;
    document.getElementById('admin-btn').classList.add('active-admin');
    document.getElementById('admin-btn').innerHTML=adminBtnHtml(true);
    closeAdminModal();render();
  } else {
    document.getElementById('admin-error').textContent='Incorrect admin code.';
    document.getElementById('admin-pin').value='';
  }
}

function saveCustomSops(arr){localStorage.setItem('wl_custom_sops',JSON.stringify(arr));}
function getCustomTabs(){try{return JSON.parse(localStorage.getItem('wl_custom_tabs')||'[]');}catch{return[];}}
function saveCustomTabs(arr){localStorage.setItem('wl_custom_tabs',JSON.stringify(arr));}

// ─── CATEGORIES ───────────────────────────────────────────────
const BASE_CATEGORIES=['All','Operations','People & HR','Projects','Social Media','Design & Brand','Client Management'];
const CAT_ICONS={'All':'grid','Operations':'building','People & HR':'users','Projects':'clipboard','Social Media':'device','Design & Brand':'palette','Client Management':'message'};
let activeFilter='All';

function getAllCategories(){
  const tabs=getCustomTabs();
  return [...BASE_CATEGORIES,...tabs.filter(t=>!BASE_CATEGORIES.includes(t))];
}

// ─── THEME ────────────────────────────────────────────────────
function toggleTheme(){
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',isDark?'light':'dark');
  localStorage.setItem('wl_theme',isDark?'light':'dark');
  document.getElementById('theme-icon').innerHTML=svgIcon(isDark?'moon':'sun',15);
  document.getElementById('theme-label').textContent=isDark?'Dark Mode':'Light Mode';
}
(function(){
  const t=localStorage.getItem('wl_theme')||'light';
  document.documentElement.setAttribute('data-theme',t);
  if(document.getElementById('theme-icon')){
    document.getElementById('theme-icon').innerHTML=svgIcon(t==='dark'?'sun':'moon',15);
    document.getElementById('theme-label').textContent=t==='dark'?'Light Mode':'Dark Mode';
  }
})();

// ─── RENDER SIDEBAR ───────────────────────────────────────────
function renderSidebar(){
  const cats=getAllCategories();
  const nav=document.getElementById('sidebar-nav');
  if(!nav)return;
  nav.innerHTML='<div class="nav-section">Categories</div>'+
    cats.map(c=>`<div class="nav-item${activeFilter===c?' active':''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">
      <span class="nav-icon">${svgIcon(CAT_ICONS[c]||'folder',15)}</span>${c}</div>`).join('');
}

function setFilter(cat){
  activeFilter=cat;
  document.getElementById('header-title').textContent=cat==='All'?'All SOPs':cat;
  render();
}

// ─── MERGE ALL SOPs ───────────────────────────────────────────
function getAllSops(){
  const custom=getCustomSops();
  return [...coreSops,...smClients,smWiki,...custom];
}

// ─── RENDER MAIN ──────────────────────────────────────────────
function render(){
  renderSidebar();
  const q=(document.getElementById('search-input')||{}).value||'';
  const ql=q.toLowerCase();
  const body=document.getElementById('main-body');
  if(!body)return;

  const allSops=getAllSops();
  const customSops=getCustomSops();

  // Stats
  const liveCount=allSops.filter(s=>s.status==='live').length;
  const soonCount=allSops.filter(s=>s.status==='coming-soon').length;
  const smCount=smClients.length+customSops.filter(s=>s.placement==='social-client').length;

  let html='';

  // Admin panel
  if(adminMode){html+=renderAdminPanel();}

  // Stats
  html+=`<div class="stats-row">
    <div class="stat-card"><div class="stat-val">${allSops.length}</div><div class="stat-label">Total SOPs</div></div>
    <div class="stat-card"><div class="stat-val">${liveCount}</div><div class="stat-label">Live</div></div>
    <div class="stat-card"><div class="stat-val">${soonCount}</div><div class="stat-label">Coming Soon</div></div>
    <div class="stat-card"><div class="stat-val">${smCount}</div><div class="stat-label">SM Clients</div></div>
  </div>`;

  // Filter pills
  html+=`<div class="filter-row">${getAllCategories().map(c=>`<div class="pill${activeFilter===c?' active':''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">
    <span class="pill-icon">${svgIcon(CAT_ICONS[c]||'folder',13)}</span>${c}</div>`).join('')}</div>`;

  const showAll=activeFilter==='All';
  const showSM=showAll||activeFilter==='Social Media';

  // Core / category SOPs (ids 32,33,35,38,39,42 are Agency SOPs shown under Social Media only)
  const coreFiltered=[...coreSops,...customSops.filter(s=>s.placement==='core')].filter(s=>{
    if([32,33,35,38,39,42,44,45].includes(s.id))return false;
    const catMatch=showAll||(s.category===activeFilter);
    if(!catMatch)return false;
    if(!ql)return true;
    return (s.title+s.desc+(s.topics||[]).join(' ')+(s.audience||[]).join(' ')).toLowerCase().includes(ql);
  });

  // Custom main-tab SOPs
  const customTabs=getCustomTabs();
  const customTabSops=customTabs.map(tab=>{
    const sops=customSops.filter(s=>s.placement===tab);
    return {tab,sops};
  });

  if(coreFiltered.length>0){
    html+=`<div class="section-header"><div class="section-title"><span class="section-icon">${svgIcon('folder',16)}</span> Core SOPs <span class="section-count">${coreFiltered.length}</span></div></div>`;
    html+=`<div class="cards-grid">${coreFiltered.map(s=>renderCard(s)).join('')}</div>`;
  }

  // Custom tab sections
  customTabSops.forEach(({tab,sops})=>{
    if(!showAll&&activeFilter!==tab)return;
    const filtered=sops.filter(s=>{
      if(!ql)return true;
      return (s.title+s.desc+(s.topics||[]).join(' ')).toLowerCase().includes(ql);
    });
    if(filtered.length>0){
      html+=`<div class="section-header"><div class="section-title"><span class="section-icon">${svgIcon(CAT_ICONS[tab]||'folder',16)}</span> ${tab} <span class="section-count">${filtered.length}</span></div></div>`;
      html+=`<div class="cards-grid">${filtered.map(s=>renderCard(s)).join('')}</div>`;
    }
  });

  // Social Media section
  if(showSM){
    const smClientsAll=[...smClients,...customSops.filter(s=>s.placement==='social-client')].sort((a,b)=>(a.order||99)-(b.order||99));
    const smFiltered=smClientsAll.filter(s=>{
      if(!ql)return true;
      return (s.title+s.desc+(s.topics||[]).join(' ')+(s.platforms||[]).join(' ')).toLowerCase().includes(ql);
    });
    const wikiMatch=!ql||(smWiki.title+smWiki.desc+(smWiki.topics||[]).join(' ')).toLowerCase().includes(ql);
    const gbpSop=smClients.find(s=>s.isGbpSop);
    const nonGbpFiltered=smFiltered.filter(s=>!s.isGbpSop);

    // Agency-wide Social Media SOPs (Sprout Social + Review Replies + Website Check) from coreSops
    const agencySmSops=coreSops.filter(s=>s.category==='Social Media'&&[35,32,33,39,38,42,44,45].includes(s.id)).sort((a,b)=>[35,32,33,39,38,42,44,45].indexOf(a.id)-[35,32,33,39,38,42,44,45].indexOf(b.id)).filter(s=>{
      if(!ql)return true;
      return (s.title+s.desc+(s.topics||[]).join(' ')+(s.audience||[]).join(' ')).toLowerCase().includes(ql);
    });

    const totalSmCount=smClientsAll.length+1+agencySmSops.length; // +1 for smWiki

    if(wikiMatch||smFiltered.length>0||agencySmSops.length>0){
      html+=`<div class="section-header"><div class="section-title"><span class="section-icon">${svgIcon('device',16)}</span> Social Media <span class="section-count">${totalSmCount}</span></div></div>`;
      if(wikiMatch){
        html+=`<div class="sm-wiki-card" onclick="openModal(20)">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
            <span class="icon-chip" style="width:34px;height:34px;border-radius:8px">${svgIcon(smWiki.icon,20)}</span>
            <div><div style="font-weight:500;font-size:15px;color:#fff">${smWiki.title}</div>
            <div style="font-size:12px;color:var(--nav-text)">${smWiki.pages} pages · Updated ${smWiki.updated}</div></div>
          </div>
          <div style="font-size:13px;color:var(--nav-text)">${smWiki.desc}</div>
        </div>`;
      }
      if(gbpSop&&(!ql||(gbpSop.title+gbpSop.desc+(gbpSop.topics||[]).join(' ')).toLowerCase().includes(ql))){
        html+=`<div class="gbp-card-featured" onclick="openModal(${gbpSop.id})">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
            <span class="icon-chip" style="width:34px;height:34px;border-radius:8px">${svgIcon(gbpSop.icon,20)}</span>
            <div><div style="font-weight:500;font-size:15px;color:#fff">${gbpSop.title}</div>
            <div style="font-size:12px;color:var(--nav-text)">${(gbpSop.platforms||[]).join(' · ')} · ${gbpSop.frequency}</div></div>
            <span class="badge" style="background:rgba(245,179,1,.18);color:var(--accent);margin-left:auto">GBP SOP</span>
          </div>
          <div style="font-size:13px;color:var(--nav-text)">${gbpSop.desc}</div>
        </div>`;
      }
      if(agencySmSops.length>0){
        html+=`<div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;margin-top:4px">Agency SOPs</div>`;
        html+=`<div class="cards-grid">${agencySmSops.map(s=>renderCard(s)).join('')}</div>`;
      }
      if(nonGbpFiltered.length>0){
        html+=`<div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Individual Client SOPs</div>`;
        html+=`<div class="client-tiles">${nonGbpFiltered.map(s=>renderClientTile(s)).join('')}</div>`;
      }
    }
  }

  if(html.replace(/<[^>]+>/g,'').trim()===''||(!coreFiltered.length&&!showSM&&customTabSops.every(({sops})=>!sops.length))){
    html+=`<div class="no-results"><div class="no-results-icon">${svgIcon('search',40)}</div><div>No SOPs found for "<strong>${q}</strong>"</div></div>`;
  }

  body.innerHTML=html;
  if(adminMode)body.classList.add('admin-mode');
  else body.classList.remove('admin-mode');
}

function renderCard(s){
  const editBtns=adminMode?`<div class="admin-card-btns">
    <button class="edit-btn" onclick="event.stopPropagation();openEditForm(${s.id})">${svgIcon('pencil',14)}</button>
  </div>`:'';

  return `<div class="sop-card" onclick="openModal(${s.id})">
    ${editBtns}
    <div class="sop-card-top">
      <span class="sop-icon icon-chip">${svgIcon(s.icon||'file',18)}</span>
      <div class="sop-badges">
        ${s.status==='coming-soon'?`<span class="badge badge-soon">SOON</span>`:''}
        ${s.pages?`<span class="badge" style="background:var(--bg3);color:var(--text3)">${s.pages}p</span>`:''}
      </div>
    </div>
    <div class="sop-title">${s.title}</div>
    <div class="sop-desc">${s.desc||''}</div>
    <div class="sop-meta">
      ${(s.audience||[]).map(a=>`<span class="tag">${a}</span>`).join('')}
      ${s.updated?`<span class="tag">${svgIcon('calendar',11)} ${s.updated}</span>`:''}
    </div>
  </div>`;
}

function renderClientTile(s){
  const editBtns=adminMode?`<div style="display:flex;gap:4px;margin-top:6px">
    <button class="edit-btn" onclick="event.stopPropagation();openEditForm(${s.id})" style="width:24px;height:24px">${svgIcon('pencil',12)}</button>
  </div>`:'';

  return `<div class="client-tile" onclick="openModal(${s.id})">
    <div class="client-tile-top">
      <span class="client-icon icon-chip">${svgIcon(s.icon||'device',14)}</span>
      <div class="client-title">${s.title}</div>
    </div>
    <div class="client-platforms">${(s.platforms||[]).map(p=>`<span class="tag">${p}</span>`).join('')}</div>
    <div class="client-freq">${s.frequency||''}</div>
    ${editBtns}
  </div>`;
}

// ─── PASSCODE MANAGEMENT ──────────────────────────────────────
function saveAppPass(){
  const v=(document.getElementById('new-app-pass')||{}).value||'';
  if(!v.trim()){showPassMsg('Please enter a passcode.');return;}
  localStorage.setItem('wl_app_pass',v.trim());
  showPassMsg('App passcode updated!');
}
function resetAppPass(){localStorage.removeItem('wl_app_pass');showPassMsg('App passcode reset to default.');}
function saveAdminPass(){
  const v=(document.getElementById('new-admin-pass')||{}).value||'';
  if(!v.trim()){showPassMsg('Please enter a passcode.');return;}
  localStorage.setItem('wl_admin_pass',v.trim());
  showPassMsg('Admin passcode updated!');
}
function resetAdminPass(){localStorage.removeItem('wl_admin_pass');showPassMsg('Admin passcode reset to default.');}
function showPassMsg(m){const el=document.getElementById('pass-msg');if(el){el.textContent=m;setTimeout(()=>{if(el)el.textContent='';},3000);}}

// ─── ADD SOP ──────────────────────────────────────────────────
function addNewSop(){
  const title=(document.getElementById('new-title')||{}).value||'';
  if(!title.trim()){document.getElementById('add-msg').textContent='Title is required!';return;}
  const placement=(document.getElementById('new-placement')||{}).value||'core';
  const tabName=placement==='new-tab'?(document.getElementById('new-tab-name')||{}).value||'New Tab':'';
  const finalPlacement=placement==='new-tab'?tabName:placement;
  const driveUrl=(document.getElementById('new-drive')||{}).value||'';
  const previewUrl=(document.getElementById('new-preview')||{}).value||driveUrl.replace('/edit','/preview').replace('/view','/preview');
  const newSop={
    id:Date.now(),
    title:title.trim(),
    icon:(document.getElementById('new-icon')||{}).value||'file',
    status:(document.getElementById('new-status')||{}).value||'live',
    pages:parseInt((document.getElementById('new-pages')||{}).value)||0,
    updated:new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'}),
    category:(document.getElementById('new-category')||{}).value||'Operations',
    driveUrl,previewUrl,
    audience:((document.getElementById('new-audience')||{}).value||'').split(',').map(s=>s.trim()).filter(Boolean),
    platforms:((document.getElementById('new-platforms')||{}).value||'').split(',').map(s=>s.trim()).filter(Boolean),
    frequency:(document.getElementById('new-freq')||{}).value||'',
    desc:(document.getElementById('new-desc')||{}).value||'',
    sections:((document.getElementById('new-sections')||{}).value||'').split('\n').map(s=>s.trim()).filter(Boolean),
    topics:((document.getElementById('new-topics')||{}).value||'').split(',').map(s=>s.trim()).filter(Boolean),
    placement:finalPlacement
  };
  const custom=getCustomSops();custom.push(newSop);saveCustomSops(custom);
  if(placement==='new-tab'&&tabName){const tabs=getCustomTabs();if(!tabs.includes(tabName)){tabs.push(tabName);saveCustomTabs(tabs);}}
  document.getElementById('add-msg').textContent='SOP added!';
  setTimeout(()=>render(),800);
}

// ─── EDIT SOP ─────────────────────────────────────────────────
function toggleEditForm(id){
  const el=document.getElementById(id);
  if(el)el.classList.toggle('open');
}

function openEditForm(id){
  const formId=`edit-${id}`;
  document.querySelectorAll('.sop-edit-form').forEach(f=>{if(f.id!==formId)f.classList.remove('open');});
  const el=document.getElementById(formId);
  if(el)el.classList.add('open');
  el&&el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function saveEdit(id){
  // Check if it's a custom SOP
  const custom=getCustomSops();
  const idx=custom.findIndex(s=>s.id===id);
  if(idx>-1){
    custom[idx].title=document.getElementById(`e-title-${id}`).value||custom[idx].title;
    custom[idx].icon=document.getElementById(`e-icon-${id}`).value||custom[idx].icon;
    custom[idx].driveUrl=document.getElementById(`e-drive-${id}`).value;
    custom[idx].previewUrl=document.getElementById(`e-preview-${id}`).value;
    custom[idx].desc=document.getElementById(`e-desc-${id}`).value;
    saveCustomSops(custom);
  } else {
    // Save override for built-in SOP
    const overrides=JSON.parse(localStorage.getItem('wl_overrides')||'{}');
    overrides[id]={
      title:document.getElementById(`e-title-${id}`).value,
      icon:document.getElementById(`e-icon-${id}`).value,
      driveUrl:document.getElementById(`e-drive-${id}`).value,
      previewUrl:document.getElementById(`e-preview-${id}`).value,
      desc:document.getElementById(`e-desc-${id}`).value,
    };
    localStorage.setItem('wl_overrides',JSON.stringify(overrides));
    applyOverrides();
  }
  const msg=document.getElementById(`edit-msg-${id}`);
  if(msg){msg.textContent='Saved!';setTimeout(()=>{if(msg)msg.textContent='';},2000);}
  setTimeout(()=>render(),600);
}
function applyOverrides(){
  let overrides={};
  try{
    overrides=JSON.parse(localStorage.getItem('wl_overrides')||'{}');
  }catch{
    overrides={};
    localStorage.removeItem('wl_overrides');
  }
  [...coreSops,...smClients,smWiki].forEach(s=>{
    if(s && overrides[s.id]) Object.assign(s, overrides[s.id]);
  });
}
applyOverrides();

function deleteSop(id){
  if(!confirm('Delete this SOP? This cannot be undone.'))return;
  const custom=getCustomSops().filter(s=>s.id!==id);
  saveCustomSops(custom);
  render();
}

// ─── MODAL ────────────────────────────────────────────────────
let currentSopId=null;
function openModal(id){
  const all=[...coreSops,...smClients,smWiki,...getCustomSops()];
  const s=all.find(x=>x.id===id);
  if(!s)return;
  currentSopId=id;
  document.getElementById('m-icon').innerHTML=svgIcon(s.icon||'file',20);
  document.getElementById('m-title').textContent=s.title;
  document.getElementById('m-sub').textContent=`${s.category||''} · ${s.pages||0} pages · Updated ${s.updated||''}`;

  // Details tab
  let details=``;
  if(s.desc)details+=`<div class="modal-section"><div class="modal-section-title">About</div><p style="font-size:13px;color:var(--text2);line-height:1.6">${s.desc}</p></div>`;
  if(s.sections&&s.sections.length)details+=`<div class="modal-section"><div class="modal-section-title">Sections (${s.sections.length})</div>
    <div class="sections-list">${s.sections.map((sec,i)=>`<div class="section-item"><span class="section-num">${i+1}</span>${sec}</div>`).join('')}</div></div>`;
  if(s.topics&&s.topics.length)details+=`<div class="modal-section"><div class="modal-section-title">Topics</div>
    <div class="modal-tags">${s.topics.map(t=>`<span class="modal-tag">${t}</span>`).join('')}</div></div>`;
  if(s.audience&&s.audience.length)details+=`<div class="modal-section"><div class="modal-section-title">Audience</div>
    <div class="modal-tags">${s.audience.map(a=>`<span class="modal-tag">${svgIcon('user',12)} ${a}</span>`).join('')}</div></div>`;
  if(s.platforms&&s.platforms.length)details+=`<div class="modal-section"><div class="modal-section-title">Platforms</div>
    <div class="modal-tags">${s.platforms.map(p=>`<span class="modal-tag">${svgIcon('device',12)} ${p}</span>`).join('')}</div></div>`;
  if(s.frequency)details+=`<div class="modal-section"><div class="modal-section-title">Posting Frequency</div>
    <span class="modal-tag">${svgIcon('calendar',12)} ${s.frequency}</span></div>`;
  document.getElementById('modal-details-body').innerHTML=details||'<p style="color:var(--text3);font-size:13px">No details available yet.</p>';

  // Full screen header button
  const fsBtn=document.getElementById('modal-fullscreen-btn');
  if(s.previewUrl){
    fsBtn.classList.remove('disabled');
    fsBtn.onclick=()=>openFullScreen(s.title,s.previewUrl);
  } else {
    fsBtn.classList.add('disabled');
    fsBtn.onclick=null;
  }

  // Preview tab
  let preview='';
  if(s.previewUrl){
    preview=`<div class="preview-fullscreen-bar">
      <button class="fullscreen-btn" onclick="openFullScreen('${s.title.replace(/'/g,"\\'")}','${s.previewUrl}')">${svgIcon('expand',14)} Open Full Screen</button>
    </div>
    <iframe class="preview-frame" src="${s.previewUrl}" frameborder="0" allowfullscreen></iframe>`;
  } else {
    preview=`<div class="preview-placeholder">${svgIcon('file',36)}<span>No preview available yet</span></div>`;
  }
  document.getElementById('modal-preview-body').innerHTML=preview;

  switchTab('details');
  document.getElementById('sop-modal').classList.add('open');
}
function closeModal(){
  document.getElementById('sop-modal').classList.remove('open');
  document.getElementById('modal-preview-body').innerHTML='';
}
function openFullScreen(title,url){
  document.getElementById('fs-title').textContent=title||'';
  document.getElementById('fs-frame').src=url;
  document.getElementById('fs-overlay').classList.add('open');
}
function closeFullScreen(){
  document.getElementById('fs-overlay').classList.remove('open');
  document.getElementById('fs-frame').src='';
}
function switchTab(tab){
  document.getElementById('tab-details').classList.toggle('active',tab==='details');
  document.getElementById('tab-preview').classList.toggle('active',tab==='preview');
  document.getElementById('modal-details-body').style.display=tab==='details'?'block':'none';
  document.getElementById('modal-preview-body').style.display=tab==='preview'?'block':'none';
}

// Close modal on overlay click
document.getElementById('sop-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeFullScreen();closeModal();closeAdminModal();}
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.getElementById('search-input')&&document.getElementById('search-input').focus();}
});

// ─── INIT ─────────────────────────────────────────────────────
if(sessionStorage.getItem('wl_authenticated')==='1'){
  render();
  const t=localStorage.getItem('wl_theme')||'light';
  document.getElementById('theme-icon').innerHTML=svgIcon(t==='dark'?'sun':'moon',15);
  document.getElementById('theme-label').textContent=t==='dark'?'Light Mode':'Dark Mode';
}
</script>
</body>
</html>
